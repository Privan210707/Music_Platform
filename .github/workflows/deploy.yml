name: Deploy Music Platform

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

        run: |
          set -e

          echo "================================"
          echo "Preparing SSH"
          echo "================================"

          KEY_FILE="$RUNNER_TEMP/ec2_key"
          KNOWN_HOSTS="$RUNNER_TEMP/known_hosts"

          printf '%s\n' "$EC2_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          echo "===== Checking SSH key ====="

          ssh-keygen -y -f "$KEY_FILE" > "$RUNNER_TEMP/ec2_key.pub"

          echo "SSH private key format: OK"

          echo "===== Checking EC2 host ====="

          ssh-keyscan -H -p 22 50.16.9.251 > "$KNOWN_HOSTS" 2>&1

          echo "EC2 host reachable on SSH port 22"

          echo "================================"
          echo "Testing SSH connection"
          echo "================================"

          ssh \
            -i "$KEY_FILE" \
            -p 22 \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            "ubuntu@50.16.9.251" \
            "echo SSH_CONNECTION_SUCCESSFUL"

          echo "================================"
          echo "Deploying application"
          echo "================================"

          ssh \
            -i "$KEY_FILE" \
            -p 22 \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            "ubuntu@50.16.9.251" \
            "bash -lc '
              set -e

              echo \"===== Loading NVM / Node.js =====\"
              source ~/.nvm/nvm.sh
              nvm use 22

              echo \"Node version:\"
              node -v

              echo \"NPM version:\"
              npm -v

              echo \"===== Pulling latest code =====\"
              cd /var/www/Music_Platform
              git pull origin main

              echo \"===== Backend =====\"
              cd /var/www/Music_Platform/BACKEND_CODE
              source venv/bin/activate

              pip install -r requirements.txt
              python manage.py migrate --noinput
              python manage.py collectstatic --noinput

              echo \"===== Frontend =====\"
              cd /var/www/Music_Platform/frontend

              npm ci
              npm run build

              echo \"===== Restarting Django =====\"
              sudo systemctl restart music-platform

              echo \"===== Restarting ML =====\"
              sudo systemctl restart music-ml

              echo \"===== Reloading Nginx =====\"
              sudo systemctl reload nginx

              echo \"===== Checking Django =====\"
              sudo systemctl is-active --quiet music-platform
              echo \"Django: RUNNING\"

              echo \"===== Checking ML =====\"
              sudo systemctl is-active --quiet music-ml
              echo \"ML: RUNNING\"

              echo \"===== Checking Nginx =====\"
              sudo systemctl is-active --quiet nginx
              echo \"Nginx: RUNNING\"

              echo \"================================\"
              echo \"DEPLOYMENT SUCCESSFUL\"
              echo \"================================\"
            '"
