name: Deploy Music Platform

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/ec2_key \
            -p 22 \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            "$EC2_USERNAME@$EC2_HOST" \
            "set -e && \
            cd /var/www/Music_Platform && \
            echo '===== Pulling latest code =====' && \
            git pull origin main && \
            echo '===== Backend =====' && \
            cd /var/www/Music_Platform/BACKEND_CODE && \
            source venv/bin/activate && \
            pip install -r requirements.txt && \
            python manage.py migrate --noinput && \
            python manage.py collectstatic --noinput && \
            echo '===== Frontend =====' && \
            cd /var/www/Music_Platform/frontend && \
            npm ci && \
            npm run build && \
            echo '===== Restarting Django =====' && \
            sudo systemctl restart music-platform && \
            echo '===== Restarting ML =====' && \
            sudo systemctl restart music-ml && \
            echo '===== Reloading Nginx =====' && \
            sudo systemctl reload nginx && \
            echo '===== Checking services =====' && \
            sudo systemctl is-active --quiet music-platform && \
            sudo systemctl is-active --quiet music-ml && \
            sudo systemctl is-active --quiet nginx && \
            echo '================================' && \
            echo 'DEPLOYMENT SUCCESSFUL' && \
            echo '================================'"
