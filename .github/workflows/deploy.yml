name: Deploy Music Platform

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -p 22 "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/ec2_key \
            -p 22 \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            "$EC2_USERNAME@$EC2_HOST" \
            "echo SSH_CONNECTION_SUCCESSFUL"

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -p 22 "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/ec2_key \
            -p 22 \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            "$EC2_USERNAME@$EC2_HOST" \
            'cd ~/Music_Platform && git pull origin main && docker compose down && docker compose up -d --build && docker compose ps'
