services:

  db:
    image: postgres:16
    container_name: music-postgres

    environment:
      POSTGRES_DB: musicdb
      POSTGRES_USER: musicuser
      POSTGRES_PASSWORD: musicpassword

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicuser -d musicdb"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build: ./BACKEND_CODE
    container_name: music-backend

    environment:
      SECRET_KEY: django-test-secret-123456789
      DEBUG: "True"

      DB_NAME: musicdb
      DB_USER: musicuser
      DB_PASSWORD: musicpassword
      DB_HOST: db
      DB_PORT: "5432"

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy


  ml:
    build: ./ML/backend
    container_name: music-ml

    ports:
      - "8001:8001"
  frontend:
    build: ./frontend
    container_name: music-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend
      - ml


volumes:
  postgres_data: